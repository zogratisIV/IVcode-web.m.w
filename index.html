<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IVcode soon</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b0f;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    .text {
      font-size: clamp(32px, 12vw, 120px); /* كبير ومتجاوب */
      font-weight: 800;
      letter-spacing: 1px;
    }
    .cursor {
      display: inline-block;
      width: 10px;
      height: 1em;
      background: #fff;
      margin-left: 8px;
      vertical-align: middle;
      animation: blink 0.8s steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="text" id="target" aria-live="polite"></div><span class="cursor" aria-hidden="true"></span>

  <script>
    // نص الظهور — غيّره هنا إذا رغبت
    const text = 'IVcode soon';
    const target = document.getElementById('target');
    let i = 0;

    function typeNext() {
      if (i <= text.length) {
        target.textContent = text.slice(0, i);
        i++;
        setTimeout(typeNext, 100); // سرعة الكتابة بالملّي-ثانية
      }
    }

    window.addEventListener('load', () => {
      typeNext();
    });
  </script>
</body>
</html>
