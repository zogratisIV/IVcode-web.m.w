<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IVcode</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #0b0b0f;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* 1. Navbar (الشريط العلوي) */
    .navbar {
      height: 60px;
      border-bottom: 1px solid #2d2d3a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background-color: #121218;
    }

    .brand {
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: 1px;
    }

    .search-bar {
      width: 40%;
      max-width: 500px;
    }

    .search-bar input {
      width: 100%;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #2d2d3a;
      background: #0b0b0f;
      color: #fff;
      outline: none;
      font-size: 0.9rem;
    }

    .search-bar input:focus {
      border-color: #58a6ff;
    }

    /* 2. Main Layout (التقسيم الرئيسي) */
    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* القائمة الجانبية (الشمال) */
    .sidebar {
      width: 260px;
      border-right: 1px solid #2d2d3a;
      background-color: #121218;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sidebar h3 {
      font-size: 0.85rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .repo-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      color: #c9d1d9;
      transition: 0.2s;
    }

    .repo-item:hover {
      background-color: #2d2d3a;
      color: #fff;
    }

    /* منطقة المحتوى (النص) */
    .content-area {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .card {
      background: #121218;
      border: 1px solid #2d2d3a;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <!-- 1. Header & Search Bar -->
  <header class="navbar">
    <div class="brand">IVcode</div>
    <div class="search-bar">
      <input type="text" placeholder="Type / to search repositories..." />
    </div>
    <div style="font-size: 0.9rem; color: #8b949e;">Profile</div>
  </header>

  <!-- 2. Main Layout -->
  <div class="app-container">
    
    <!-- Sidebar Left -->
    <aside class="sidebar">
      <h3>Repositories</h3>
      <div class="repo-item">📁 project-alpha</div>
      <div class="repo-item">📁 rust-backend</div>
      <div class="repo-item">📁 ivcode-web</div>
    </aside>

    <!-- Center Content -->
    <main class="content-area">
      <div class="card">
        <h2>أهلاً بك في IVcode</h2>
        <p style="color: #8b949e; margin-top: 8px;">هنا هتتحط كل الحبشتكنات، الـ Feeds، أو إحصائيات المشروعات.</p>
      </div>
    </main>

  </div>

</body>
</html>
