<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IVcode</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #0b0b0f;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    /* 1. Header ثابت فوق */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 60px;
      border-bottom: 1px solid #2d2d3a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background-color: #121218;
    }

    .brand {
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: 1px;
    }

    .search-bar {
      width: 40%;
      max-width: 500px;
    }

    .search-bar input {
      width: 100%;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #2d2d3a;
      background: #0b0b0f;
      color: #fff;
      outline: none;
      font-size: 0.9rem;
    }

    .search-bar input:focus {
      border-color: #58a6ff;
    }

    /* 2. Main Layout (يمتد لتحت عادي) */
    .app-container {
      display: flex;
      min-height: calc(100vh - 60px);
    }

    /* القائمة الجانبية (جاهزة للتحويل لأيقونات بسهولة) */
    .sidebar {
      width: 240px;
      border-right: 1px solid #2d2d3a;
      background-color: #121218;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: sticky;
      top: 60px;
      height: calc(100vh - 60px);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      color: #c9d1d9;
      transition: 0.2s;
      font-size: 0.95rem;
    }

    .nav-item:hover {
      background-color: #2d2d3a;
      color: #fff;
    }

    /* منطقة المحتوى الممتدة لتحت */
    .content-area {
      flex: 1;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: #121218;
      border: 1px solid #2d2d3a;
      border-radius: 8px;
      padding: 24px;
    }

    .card h3 {
      margin-bottom: 10px;
      color: #58a6ff;
    }

    .card p {
      color: #8b949e;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="brand">IVcode</div>
    <div class="search-bar">
      <input type="text" placeholder="Type / to search repositories..." />
    </div>
    <div style="font-size: 0.9rem; color: #8b949e;">Profile</div>
  </header>

  <div class="app-container">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="nav-item"><span>📁</span> <span class="text">Projects</span></div>
      <div class="nav-item"><span>⚡</span> <span class="text">Activity</span></div>
      <div class="nav-item"><span>⚙️</span> <span class="text">Settings</span></div>
    </aside>

    <!-- Content (ممتد وسكرول) -->
    <main class="content-area">
      <div class="card">
        <h3>Main Section</h3>
        <p>بداية المحتوى الأساسي للـ IVcode.</p>
      </div>

      <div class="card">
        <h3>Recent Updates</h3>
        <p>هنا الحبشتكنات والـ Feed الممتدة لتحت براحتك...</p>
      </div>

      <div class="card">
        <h3>More Content</h3>
        <p>كارت تاني عشان الصفحة تسكرول وتشوف امتدادها.</p>
      </div>

      <div class="card">
        <h3>Footer Area Card</h3>
        <p>آخر الكروت الممتدة أسفل الصفحة.</p>
      </div>
    </main>

  </div>

</body>
</html>
