<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- توهج خفيف للشهاب الحاد -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- خلفية سوداء داكنة -->
  <rect width="500" height="500" fill="#000000" rx="90" />

  <!-- حرف C على شكل مسار شهاب حاد وشرس يغلف الحروف -->
  <path d="M 370 110 
           C 280 60, 100 110, 80 230 
           C 60 360, 220 440, 380 370 
           L 320 330 
           C 210 370, 120 310, 130 230 
           C 140 150, 270 120, 335 150 Z" 
        fill="#ffffff" 
        filter="url(#glow)" />

  <!-- رأس الشهاب الحاد جداً في أعلى الـ C -->
  <polygon points="370,110 335,150 410,100" fill="#ffffff" filter="url(#glow)" />

  <!-- حرفي IV بأسلوب هندسي حاد وشديد الوضوح -->
  <g fill="#ffffff" filter="url(#glow)">
    <!-- حرف I (شكل زوايا حادة) -->
    <polygon points="200,190 225,190 225,310 200,310" />

    <!-- حرف V (حاد وشرس) -->
    <polygon points="250,190 275,190 305,275 335,190 360,190 315,310 295,310" />
  </g>
</svg>
